services:
  api:
    build:
      context: .
      target: api
    environment:
      API_TOKENS: ${API_TOKENS:-}
      ADMIN_TOKENS: ${ADMIN_TOKENS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-5}
      MODEL_DIR: /app/models
      AUDIT_LOG_DIR: /app/outputs/audit
      PATIENT_RECORDS_PATH: /app/outputs/patient_records.xlsx
      PATIENT_RECORD_WRITERS: ${PATIENT_RECORD_WRITERS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/v1/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      target: frontend
    environment:
      BACKEND_URL: http://api:8000
      FRONTEND_API_TOKEN: ${FRONTEND_API_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
volumes:
  audit:
